name: DOI lineage guard (automatic write-back disabled)

# The canonical Thesis v8 publication already exists at version DOI
# 10.5281/zenodo.21184984 under concept DOI 10.5281/zenodo.20567256.
# A GitHub release can create a new Zenodo record; it cannot select and update
# that existing concept. Automatic mint/write-back is therefore intentionally
# disabled. See ZENODO_DEPOSIT_POLICY.md for the authenticated update workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy:
    name: Confirm manual DOI policy
    runs-on: ubuntu-latest
    steps:
      - name: Automatic write-back is held
        run: |
          echo "Automatic Zenodo mint and DOI write-back are disabled for this repository."
          echo "Update the existing Thesis v8 concept through an authenticated Zenodo session/API."
          echo "Create a paper-specific record only after a duplicate check and publication decision."
