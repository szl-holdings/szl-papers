name: Frontier research intake contract (source only)

on:
  pull_request:
    paths:
      - "docs/research/frontier-research-intake-20261119.json"
      - "docs/research/FRONTIER_RESEARCH_TO_ESTATE_CONVERGENCE_20261119.md"
      - "scripts/validate_frontier_intake.py"
      - "scripts/test_validate_frontier_intake.py"
      - ".github/workflows/frontier-intake.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: frontier-intake-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Offline source and tamper tests
        run: python3 -m unittest discover -s scripts -p 'test_validate_frontier_intake.py' -v
      - name: Validate seven source-only research records
        run: python3 scripts/validate_frontier_intake.py docs/research/frontier-research-intake-20261119.json
