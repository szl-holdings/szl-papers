name: Claim backing registry guard

# Served-claim -> real-Lean-corpus backing guard for the Ouroboros claim corpus.
# Runs a stdlib-only Python check over thesis/ouroboros/corpus-v18/claims_v18_extracted.json:
# any claim asserting a proved / kernel-verified status must carry a Lean citation
# or the in-repo allowlist, but path syntax is classified as reference-only; and
# UNCONDITIONAL Lambda-aggregator uniqueness must be reported as Conjecture 1,
# disproved as stated; conditional Theorem U is the proved result and the
# weaker-condition question remains open.
# The separate locked-claim contract binds the locked eight to exact revision-bound
# kernel evidence. Neither check re-runs the Lean kernel or promotes paper wording.
# No dependencies.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'thesis/ouroboros/corpus-v18/claims_v18_extracted.json'
      - 'thesis/EXPERIMENTAL_LEAN_THEOREMS.md'
      - 'PAPERS_INDEX.md'
      - 'PREPRINT_PUBLICATION_RECORDS.json'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'scripts/check_preprint_publication_records.py'
      - 'scripts/check_claim_backing.py'
      - 'scripts/check_review_ledger.py'
      - 'scripts/check_locked_claim_contract.py'
      - 'metadata/locked-claim-contract.json'
      - 'evidence/lutar-lean/**'
      - 'reviews/v26-locked-eight-claim-ledger.json'
      - 'reviews/v26-locked-eight-claim-ledger.md'
      - 'thesis/ouroboros/papers/v26/unified-gpd-thesis-v26.md'
      - '.github/workflows/claim-registry.yml'
  push:
    branches: [main]
    paths:
      - 'thesis/ouroboros/corpus-v18/claims_v18_extracted.json'
      - 'thesis/EXPERIMENTAL_LEAN_THEOREMS.md'
      - 'PAPERS_INDEX.md'
      - 'PREPRINT_PUBLICATION_RECORDS.json'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'scripts/check_preprint_publication_records.py'
      - 'scripts/check_claim_backing.py'
      - 'scripts/check_review_ledger.py'
      - 'scripts/check_locked_claim_contract.py'
      - 'metadata/locked-claim-contract.json'
      - 'evidence/lutar-lean/**'
      - 'reviews/v26-locked-eight-claim-ledger.json'
      - 'reviews/v26-locked-eight-claim-ledger.md'
      - 'thesis/ouroboros/papers/v26/unified-gpd-thesis-v26.md'
      - '.github/workflows/claim-registry.yml'

permissions:
  contents: read

jobs:
  claim-registry:
    name: Served-claim backing registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard self-test (positive + negative fixtures)
        run: python3 scripts/check_claim_backing.py --self-test

      - name: Guard on the real claim corpus
        run: python3 scripts/check_claim_backing.py

      - name: Review-ledger self-test
        run: python3 scripts/check_review_ledger.py --self-test

      - name: Review-ledger source anchors
        run: python3 scripts/check_review_ledger.py

      - name: Locked-claim contract self-test
        run: python3 scripts/check_locked_claim_contract.py --self-test

      - name: Exact locked-claim contract
        run: python3 scripts/check_locked_claim_contract.py
