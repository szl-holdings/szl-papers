name: Evidence Closure Graph source intake (no release authority)

on:
  pull_request:
    paths:
      - "docs/research/EVIDENCE_CLOSURE_GRAPH_20261119.md"
      - "scripts/assess_evidence_closure_graph.py"
      - "scripts/test_assess_evidence_closure_graph.py"
      - ".github/workflows/ecg-source-only.yml"

permissions:
  contents: read

concurrency:
  group: ecg-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  negative-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Offline ECG malformed/dissent/cycle/source tests
        run: python3 -B -m unittest discover -s scripts -p 'test_assess_evidence_closure_graph.py' -v
